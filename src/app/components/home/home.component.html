<div class="h-screen w-screen relative overflow-hidden bg-black">
  <!-- Navbar -->
  <app-navbar></app-navbar>

  <!-- Razón social -->
  <div class="w-full flex justify-between items-center mt-20 px-8 fixed z-50">
    <p class="text-6xl font-bold text-[#c0c0c0]">momoto</p>
    <div (click)="navigateToSignIn()" class="cursor-pointer">
      <img src="icons/user-circle.svg" class="w-10 h-10" alt="" />
    </div>
  </div>

  <!-- Contenedor de Video de Fondo -->
  <div class="absolute inset-0">
    <video autoplay loop muted playsinline class="w-full h-full object-cover">
      <source src="videos/momoto.mp4" type="video/mp4" />
      Tu navegador no soporta el elemento de video.
    </video>
  </div>

  <!-- Degradado negro transparente -->
  <div
    class="absolute inset-0 bg-gradient-to-t from-black to-transparent"
  ></div>

  <!-- Footer -->
  <app-footer></app-footer>
</div>
